# ============================================================================
# Preprocessing Configuration: PP0002 (Controlled CLAHE Contrast Ablation)
# Spec: 05_Preprocessing/specs/pipeline.md |UD12 (DEC0012)
# Single Controlled Factor vs PP0001: clahe.enabled = true (clip_limit=2.0, 8x8 grid on uint16 scaled range)
# ============================================================================

preprocessing_id: PP0002
name: mammography_clahe_ablation_512
role: controlled_ablation
parent_baseline_id: PP0001
protocol_version: v1.0.0
input_label_protocol: T09_v1.0.1 + ADJ-017-02_Option_B

intensity:
  monochrome1_invert: true
  apply_dicom_rescale: true
  bit_depth_mode: header_bits_stored
  rgb_identical_channel_collapse: true
  target_range: [0.0, 1.0]

foreground_crop:
  enabled: true
  air_threshold: 0.02
  min_component_area_frac: 0.005
  safety_margin_px: 16
  safety_margin_frac: 0.02
  skip_if_area_coverage_ge: 0.92
  enforce_zero_roi_clipping: true

artifact_policy:
  suppress_corner_markers_in_pixels: false
  strip_green_bmcd_ruler_in_gt_only: true

clahe:
  enabled: true                              # sole scientific change vs PP0001 baseline
  clip_limit: 2.0
  tile_grid_size: [8, 8]

geometry:
  target_size: 512
  preserve_aspect_ratio: true
  pad_value: 0.0
  image_downsample_interp: INTER_AREA
  image_upsample_interp: INTER_LINEAR
  mask_interp: INTER_NEAREST

normalization:
  policy: imagenet_rgb
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  fit_partition_required: train

training_only_augmentations:
  apply_during_rel_materialization: false
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.0
  rotation_deg_range: [-10.0, 10.0]
  translate_frac_range: [-0.05, 0.05]
  scale_range: [0.95, 1.05]
  brightness_contrast_scale: [0.92, 1.08]
  gamma_range: [0.90, 1.10]
  random_erasing_or_cutout: false
  mixup_or_cutmix: false
